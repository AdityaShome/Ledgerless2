[project]
name = "a2a-recovery"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "a2a-sdk[http-server]==1.3.0",
  "uvicorn>=0.30",
  "cryptography>=43",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["recovery", "agents", "agents.tools", "bench", "bench.scenarios", "baselines", "baselines.temporal_bridge", "baselines.mesh_quarantine", "examples", "examples.use_cases", "dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.package-data]
"examples.use_cases" = ["*.json"]
"dashboard" = ["*.html"]

[project.scripts]
ledgerless-demo = "examples.run_use_cases:main"
ledgerless-dashboard = "dashboard.app:main"
